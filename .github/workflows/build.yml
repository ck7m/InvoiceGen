name: Build Multi-Platform Desktop Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: SKN_Invoice_Generator_Windows
            output_dir: dist/SKN_Invoice_Generator
          - os: macos-latest
            artifact_name: SKN_Invoice_Generator_macOS
            output_dir: dist/SKN_Invoice_Generator.app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Automated Tests
        run: |
          uv run pytest -v

      - name: Build Standalone Executable
        run: |
          uv run python scripts/build_executable.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_dir }}
