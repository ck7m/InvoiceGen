name: Build Multi-Platform Desktop Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-desktop==0.86.5
          pip install pyinstaller pytest

      - name: Run Tests
        shell: bash
        run: |
          pytest -v

      - name: Build Windows Executable
        shell: bash
        run: |
          python scripts/build_executable.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKN_Invoice_Generator_Windows
          path: dist/SKN_Invoice_Generator/
          if-no-files-found: error

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-desktop==0.86.5
          pip install pyinstaller pytest

      - name: Run Tests
        run: |
          pytest -v

      - name: Build macOS Application Bundle
        run: |
          python scripts/build_executable.py

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKN_Invoice_Generator_macOS
          path: dist/SKN_Invoice_Generator.app
          if-no-files-found: error
