[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skn-invoice-gen"
version = "0.1.0"
description = "Sai Krishna Networks GST Invoice Generator Desktop App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.21.0",
    "weasyprint>=60.0",
    "xhtml2pdf>=0.2.11",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

